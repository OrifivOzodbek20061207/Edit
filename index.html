<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>EDIT — Sun'iy Ong</title>
<style>
  :root{
    --bg: linear-gradient(135deg,#0f0c29,#24243e,#302b63);
    --surface: rgba(255,255,255,.06);
    --surface-2: rgba(255,255,255,.12);
    --border: rgba(255,255,255,.12);
    --text: #fff;
    --text-2: rgba(255,255,255,.6);
    --accent: #818cf8;
    --accent-2: #6366f1;
    --user-b: linear-gradient(135deg,#6366f1,#8b5cf6);
    --edit-b: rgba(255,255,255,.08);
    --success:#10b981; --warn:#f59e0b; --err:#ef4444;
    --shadow: 0 8px 32px rgba(0,0,0,.3);
  }
  [data-theme="light"]{
    --bg: linear-gradient(135deg,#e0e7ff,#f0f4ff,#dbeafe);
    --surface: rgba(255,255,255,.75);
    --surface-2: rgba(255,255,255,.9);
    --border: rgba(99,102,241,.15);
    --text: #1e1b4b;
    --text-2: rgba(30,27,75,.65);
    --edit-b: rgba(99,102,241,.12);
    --shadow: 0 8px 32px rgba(99,102,241,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;transition:background .4s,color .4s}
  .app{display:flex;flex-direction:column;height:100dvh;max-width:900px;margin:0 auto}
  .header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);z-index:10}
  .header-left{display:flex;align-items:center;gap:12px}
  .avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#ec4899);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#fff;box-shadow:0 4px 16px rgba(99,102,241,.4);animation:pulse 3s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 4px 16px rgba(99,102,241,.4)}50%{box-shadow:0 4px 24px rgba(236,72,153,.6)}}
  .header-info h1{font-size:18px;font-weight:700;background:linear-gradient(135deg,#818cf8,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .status{font-size:11px;color:var(--success);display:flex;align-items:center;gap:4px}
  .status.offline{color:var(--warn)}
  .status::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 2s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  .header-right{display:flex;gap:8px}
  .icon-btn{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
  .icon-btn:active{transform:scale(.92)}
    .chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
  .message{max-width:85%;padding:12px 16px;border-radius:18px;font-size:15px;line-height:1.5;word-wrap:break-word;animation:slide .3s ease;position:relative;white-space:pre-wrap}
  @keyframes slide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .message.user{align-self:flex-end;background:var(--user-b);color:#fff;border-bottom-right-radius:6px;box-shadow:0 4px 12px rgba(99,102,241,.3)}
  .message.edit{align-self:flex-start;background:var(--edit-b);border:1px solid var(--border);border-bottom-left-radius:6px;backdrop-filter:blur(10px)}
  .message .meta{font-size:10px;color:var(--text-2);margin-top:4px;opacity:.7}
  .message.user .meta{color:rgba(255,255,255,.7);text-align:right}
  .message .speak-btn{position:absolute;bottom:-18px;left:0;font-size:11px;background:none;border:none;color:var(--text-2);cursor:pointer;padding:2px 6px;border-radius:6px;opacity:.5}
  .typing{display:flex;gap:4px;align-items:center;padding:12px 18px;background:var(--edit-b);border:1px solid var(--border);border-radius:18px;border-bottom-left-radius:6px;align-self:flex-start;width:fit-content}
  .typing span{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:typ 1.4s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes typ{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
  .welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:16px}
  .welcome-avatar{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#ec4899);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:700;color:#fff;box-shadow:0 8px 32px rgba(99,102,241,.5);animation:float 4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .welcome h2{font-size:24px;background:linear-gradient(135deg,#818cf8,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .welcome p{color:var(--text-2);font-size:14px;max-width:320px}
  .welcome .creator{font-size:12px;margin-top:8px}
  .welcome .creator b{color:var(--accent)}
  .quick-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px;max-width:400px}
  .quick-actions button{padding:8px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:13px;cursor:pointer;transition:.2s}
  .quick-actions button:active{transform:scale(.95);background:var(--accent-2);color:#fff}
  .input-area{padding:12px 12px calc(env(safe-area-inset-bottom) + 12px);background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;gap:6px;align-items:center}
  .action-btn,.mic-btn{flex-shrink:0;width:42px;height:42px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
  .action-btn:active,.mic-btn:active{transform:scale(.92)}
  .mic-btn{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;box-shadow:0 4px 16px rgba(99,102,241,.4)}
  .mic-btn.listening{background:linear-gradient(135deg,#ef4444,#ec4899);animation:micP 1s infinite}
  @keyframes micP{0%,100%{box-shadow:0 4px 16px rgba(239,68,68,.4);transform:scale(1)}50%{box-shadow:0 4px 28px rgba(239,68,68,.7);transform:scale(1.05)}}
  .mode-btn{flex-shrink:0;height:42px;padding:0 10px;border-radius:14px;border:1px solid var(--border);font-size:11px;font-weight:700;cursor:pointer;transition:.2s}
  .mode-btn.online{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none}
  .mode-btn.offline{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border:none}
  .input-wrap{flex:1}
  #input{width:100%;height:42px;padding:0 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:15px;outline:none;transition:.2s}
  #input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.2)}
  #input::placeholder{color:var(--text-2)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;animation:fade .2s}
  .modal.active{display:flex}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal-content{background:var(--bg);border-radius:24px;border:1px solid var(--border);padding:24px;max-width:440px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow);animation:slideUp .3s ease}
  @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .modal-header h2{font-size:18px}
  .close-btn{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:18px;cursor:pointer}
  .form-group{margin-bottom:16px}
  .form-group label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px;font-weight:500}
  .form-group input,.form-group select{width:100%;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:14px;outline:none;transition:.2s}
  .form-group input:focus,.form-group select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.2)}
  .form-group input[type="range"]{padding:0;height:6px}
  .btn{width:100%;padding:14px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;margin-top:8px}
  .btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 4px 16px rgba(99,102,241,.4)}
  .btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
  .btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
  .hint{font-size:11px;color:var(--text-2);margin-top:4px;line-height:1.4}
  #cameraVideo{width:100%;border-radius:16px;background:#000;aspect-ratio:3/4;object-fit:cover}
  .camera-controls{display:flex;gap:8px;margin-top:12px}
  .toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 80px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-2);backdrop-filter:blur(20px);border:1px solid var(--border);padding:12px 20px;border-radius:14px;color:var(--text);font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.3s;z-index:200;max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.error{border-color:var(--err);color:#fca5a5}
  .toast.success{border-color:var(--success);color:#6ee7b7}
  .recording-indicator{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(239,68,68,.9);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;display:none;align-items:center;gap:8px;z-index:50}
  .recording-indicator.active{display:flex}
  .recording-indicator .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1s infinite}
  .hidden{display:none !important}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="header-left"><div class="avatar">E</div><div class="header-info"><h1>EDIT</h1><span class="status" id="status">Online</span></div></div>
    <div class="header-right"><button class="icon-btn" id="themeBtn">🌙</button><button class="icon-btn" id="settingsBtn">⚙️</button></div>
  </header>
  <main class="chat" id="chat">
    <div class="welcome" id="welcome">
      <div class="welcome-avatar">E</div><h2>Salom, Ozodbek!</h2><p>Men EDIT — sening shaxsiy sun'iy ongingman.</p><p class="creator">Yaratuvchi: <b>Ozodbek</b></p>
      <div class="quick-actions"><button onclick="quickAction('Sen kimsan?')">Sen kimsan?</button><button onclick="quickAction('O\'zbekiston poytaxti qayer?')">Poytaxt</button><button onclick="quickAction('Suv formulasi nima?')">Suv</button><button onclick="quickAction('yangiliklar')">Yangiliklar</button></div>
    </div>
  </main>
  <div class="recording-indicator" id="recordingIndicator"><span class="dot"></span><span>Eshityapman...</span></div>
  <div class="input-area">
    <button class="action-btn" id="cameraBtn">📷</button><button class="action-btn" id="newsBtn">📰</button>
    <div class="input-wrap"><input type="text" id="input" placeholder="Xabar yozing..." autocomplete="off"></div>
    <button class="mode-btn online" id="modeBtn">ON</button><button class="mic-btn" id="micBtn">🎤</button>
  </div>
</div>
<div class="modal" id="settingsModal"><div class="modal-content"><div class="modal-header"><h2>⚙️ Sozlamalar</h2><button class="close-btn" onclick="closeModal('settingsModal')">✕</button></div>
  <div class="form-group"><label>Ismingiz</label><input type="text" id="nameInput"></div>
  <div class="form-group"><label>Ovoz tezligi: <span id="rateVal">1.0</span></label><input type="range" id="rateSlider" min="0.5" max="1.5" step="0.1" value="1.0"></div>
  <div class="form-group"><label>Ovoz balandligi: <span id="pitchVal">1.0</span></label><input type="range" id="pitchSlider" min="0.5" max="2.0" step="0.1" value="1.0"></div>
  <div class="form-group"><label>Volume: <span id="volVal">1.0</span></label><input type="range" id="volSlider" min="0" max="1" step="0.1" value="1.0"></div>
  <div class="form-group"><label>Ovoz turi</label><select id="voiceSelect"></select></div>
  <button class="btn btn-primary" onclick="saveSettings()">💾 Saqlash</button><button class="btn btn-secondary" onclick="clearHistory()">🗑 Suhbatni tozalash</button><button class="btn btn-danger" onclick="clearAll()">⚠️ Hammasini o'chirish</button>
</div></div>
<div class="modal" id="cameraModal"><div class="modal-content"><div class="modal-header"><h2>📷 Kamera</h2><button class="close-btn" onclick="closeCamera()">✕</button></div><video id="cameraVideo" autoplay playsinline></video><div class="camera-controls"><button class="btn btn-primary" onclick="captureAndOCR()">📸 O'qish</button><button class="btn btn-secondary" onclick="switchCamera()">🔄</button></div><div class="hint" id="ocrStatus"></div></div></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
  'use strict';
const CREATOR = 'Ozodbek';
const APP_NAME = 'EDIT';

const WORLD_KNOWLEDGE = {
  "o'zbekiston poytaxti":"Toshkent","poytaxti qayer":"Toshkent","o'zbekiston prezidenti":"Shavkat Mirziyoyev","o'zbekiston aholisi":"36 milliondan ortiq (2024)","o'zbekiston tili":"O'zbek tili (rasmiy)","o'zbekiston puli":"So'm","o'zbekiston mustaqilligi":"1991-yil 1-sentabr","o'zbekiston maydoni":"448,978 km²","toshkent":"O'zbekiston poytaxti, eng katta shahri","samarqand":"Qadimiy shahar, Registon maydoni, 2700+ yillik tarix","buxoro":"Qadimiy shahar, 2500+ yillik tarix","xiva":"Ichan Qal'a, qadimiy shahar","namangan":"Viloyat markazi","andijon":"Viloyat markazi","farg'ona":"Viloyat markazi","qarshi":"Viloyat markazi","termiz":"Viloyat markazi","nukus":"Qoraqalpog'iston poytaxti","urganch":"Viloyat markazi","navoiy":"Viloyat markazi","jizzax":"Viloyat markazi","guliston":"Viloyat markazi","eng katta okean":"Tinch okeani","eng kichik okean":"Shimoliy Muz okeani","eng katta qit'a":"Osiyo","eng kichik qit'a":"Avstraliya","eng baland tog'":"Everest (8848 m)","eng uzun daryo":"Nil (Afrika)","eng katta cho'l":"Sahroi Kabir","eng katta davlat":"Rossiya","eng kichik davlat":"Vatikan","eng ko'p aholili davlat":"Hindiston","dunyo aholisi":"8 milliarddan ortiq","yer sayyorasi":"Quyoshdan uchinchi sayyora","quyosh":"Quyosh tizimining markazi","oy":"Yerning tabiiy yo'ldoshi","mars":"Qizil sayyora","yupiter":"Eng katta sayyora","saturn":"Halqalari bilan mashhur","aqsh poytaxti":"Vashington","rossiya poytaxti":"Moskva","xitoy poytaxti":"Pekin","yaponiya poytaxti":"Tokio","hindiston poytaxti":"Nyu-Dehli","fransiya poytaxti":"Parij","germaniya poytaxti":"Berlin","buyuk britaniya poytaxti":"London","italiya poytaxti":"Rim","ispaniya poytaxti":"Madrid","turkiya poytaxti":"Anqara","qozog'iston poytaxti":"Ostona","qirg'iziston poytaxti":"Bishkek","tojikiston poytaxti":"Dushanbe","turkmaniston poytaxti":"Ashxobod","afg'oniston poytaxti":"Kobul","pokiston poytaxti":"Islomobod","eron poytaxti":"Tehron","misr poytaxti":"Qohira","braziliya poytaxti":"Braziliya","kanada poytaxti":"Ottava","avstraliya poytaxti":"Kanberra","koreya poytaxti":"Seul","suv formulasi":"H₂O","suv qaynash harorati":"100°C","suv muzlash harorati":"0°C","yorug'lik tezligi":"300,000 km/s","tovush tezligi":"343 m/s","yer tortishish kuchi":"9.8 m/s²","havo tarkibi":"78% azot, 21% kislorod","atom":"Moddaning eng kichik zarrasi","molekula":"Atomlardan tuzilgan zarra","nyuton qonunlari":"3 ta harakat qonuni","vodorod":"H — eng yengil element","kislorod":"O — nafas uchun zarur","uglerod":"C — hayot asosi","temir":"Fe — qonda gemoglobin","oltin":"Au — qimmatbaho metall","kumush":"Ag — qimmatbaho metall","mis":"Cu — elektr o'tkazgich","tuz formulasi":"NaCl","karbonat angidrid":"CO₂","metan":"CH₄","davriy jadval":"Mendeleyev, 118 element","inson yuragi":"4 kamerali","inson miyasi":"~86 milliard neyron","dna":"Irsiy molekula","hujayra":"Hayot birligi","fotosintez":"Quyosh nuridan ozuqa","qon guruhlari":"A, B, AB, O","inson suyagi":"206 ta","inson tishi":"32 ta","pi soni":"3.14159","aylana yuzasi":"π × r²","aylana uzunligi":"2 × π × r","uchburchak yuzasi":"(asos × balandlik) / 2","pifagor teoremasi":"a² + b² = c²","birinchi jahon urushi":"1914-1918","ikkinchi jahon urushi":"1939-1945","amerika kashfiyoti":"1492, Kolumb","buyuk ipak yo'li":"Xitoydan Yevropaga","temuriylar":"Amir Temur asos solgan","bobur":"Boburiylar asoschisi","al-xorazmiy":"Algebra asoschisi","ibn sino":"Buyuk tabib","ulug'bek":"Astronom","mustaqillik kuni":"1-sentabr","konstitutsiya kuni":"8-dekabr","navro'z":"21-mart","hafta kunlari":"Dushanba, Seshanba, Chorshanba, Payshanba, Juma, Shanba, Yakshanba","oylar":"Yanvar, Fevral, Mart, Aprel, May, Iyun, Iyul, Avgust, Sentabr, Oktabr, Noyabr, Dekabr","haftada necha kun":"7","yilda necha oy":"12","yilda necha kun":"365","soatda necha daqiqa":"60","daqiqada necha soniya":"60","bir kilometr":"1000 metr","bir kilogramm":"1000 gramm"
};

const NEWS_SOURCES = { 
  uz:{name:"Google News (O'zbekiston)",url:'https://news.google.com/rss?hl=uz&gl=UZ&ceid=UZ:uz'}, 
  dunyo:{name:'Google News (Dunyo)',url:'https://news.google.com/rss?hl=en&gl=US&ceid=US:en'}, 
  kun:{name:'Kun.uz',url:'https://kun.uz/rss'}, 
  daryo:{name:'Daryo.uz',url:'https://daryo.uz/rss'} 
};

const state = { 
  mode:'online', isListening:false, isProcessing:false, userName:'Ozodbek', messages:[], facts:[], 
  settings:{voiceRate:1.0,voicePitch:1.0,voiceVolume:1.0,voiceURI:'',theme:'dark',voiceEnabled:true}, 
  cameraStream:null, facingMode:'environment', recognition:null, voices:[] 
};

const $ = id => document.getElementById(id); 
const chatEl=$('chat'), welcomeEl=$('welcome'), inputEl=$('input'), micBtn=$('micBtn'), modeBtn=$('modeBtn'), statusEl=$('status'), recordingIndicator=$('recordingIndicator'), toastEl=$('toast');

const S = { 
  get(k,d=null){try{const v=localStorage.getItem('edit_'+k);return v?JSON.parse(v):d}catch(e){return d}}, 
  set(k,v){try{localStorage.setItem('edit_'+k,JSON.stringify(v))}catch(e){}}, 
  rm(k){try{localStorage.removeItem('edit_'+k)}catch(e){}} 
};

let toastTimer;
function toast(msg,type=''){toastEl.textContent=msg;toastEl.className='toast show '+type;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.className='toast',3000)}
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);$('themeBtn').textContent=t==='dark'?'☀️':'🌙';state.settings.theme=t}
function toggleTheme(){applyTheme(state.settings.theme==='dark'?'light':'dark');S.set('settings',state.settings)}

function init(){
  state.userName=S.get('userName','Ozodbek');state.messages=S.get('messages',[]);state.facts=S.get('facts',[]);state.mode=S.get('mode','online');
  const sv=S.get('settings',null);if(sv)state.settings=Object.assign({},state.settings,sv);
  applyTheme(state.settings.theme);updateModeUI();updateOnlineStatus();
  if(state.messages.length>0){welcomeEl.classList.add('hidden');state.messages.forEach(m=>renderMessage(m.role,m.content,false));scrollBottom()}
  initVoices();initRecognition();
  $('themeBtn').addEventListener('click',toggleTheme);
  $('settingsBtn').addEventListener('click',()=>{loadSettingsUI();$('settingsModal').classList.add('active')});
  micBtn.addEventListener('click',toggleListening);modeBtn.addEventListener('click',toggleMode);
  $('cameraBtn').addEventListener('click',openCamera);$('newsBtn').addEventListener('click',()=>showNews('uz'));
  inputEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
  window.addEventListener('online',updateOnlineStatus);window.addEventListener('offline',updateOnlineStatus);
  if(speechSynthesis.onvoiceschanged!==undefined){speechSynthesis.onvoiceschanged=initVoices}
  }
  function updateOnlineStatus(){
  if(navigator.onLine){statusEl.textContent='Online';statusEl.className='status'}
  else{statusEl.textContent='Offline';statusEl.className='status offline';
    if(state.mode==='online'){toast('Internet yo\'q — oflayn rejimga o\'tildi','error');state.mode='offline';updateModeUI()}
  }
}
function toggleMode(){
  if(state.mode==='online'&&!navigator.onLine){toast('Internet yo\'q','error');return}
  state.mode=state.mode==='online'?'offline':'online';S.set('mode',state.mode);updateModeUI();
  toast(state.mode==='online'?'🌐 Online':'📴 Offline');
}
function updateModeUI(){
  if(state.mode==='online'){modeBtn.textContent='ON';modeBtn.className='mode-btn online'}
  else{modeBtn.textContent='OFF';modeBtn.className='mode-btn offline'}
}

function initVoices(){
  state.voices=speechSynthesis.getVoices();if(state.voices.length===0)return;
  const sel=$('voiceSelect');sel.innerHTML='';
  state.voices.forEach(v=>{const o=document.createElement('option');o.value=v.voiceURI;o.textContent=v.name+' ('+v.lang+')';sel.appendChild(o)});
  if(!state.settings.voiceURI){const f=pickFemale();if(f){state.settings.voiceURI=f.voiceURI;sel.value=f.voiceURI}}
  else{sel.value=state.settings.voiceURI}
}
function pickFemale(){
  const v=state.voices,keys=['female','woman','girl','qiz','ayol','zira','samantha','victoria','karen','tessa','milena','alena','oksana','yandex','google'];
  let uz=v.find(x=>x.lang.startsWith('uz'));if(uz)return uz;
  let ru=v.find(x=>x.lang.startsWith('ru')&&keys.some(k=>x.name.toLowerCase().includes(k)));if(ru)return ru;
  let tr=v.find(x=>x.lang.startsWith('tr'));if(tr)return tr;
  let any=v.find(x=>keys.some(k=>x.name.toLowerCase().includes(k)));if(any)return any;
  return v[0];
}
function speak(text){
  if(!state.settings.voiceEnabled||!('speechSynthesis'in window))return;
  try{
    speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);
    u.rate=state.settings.voiceRate;u.pitch=state.settings.voicePitch;u.volume=state.settings.voiceVolume;
    const v=state.voices.find(x=>x.voiceURI===state.settings.voiceURI);if(v)u.voice=v;
    u.onerror=()=>{};speechSynthesis.speak(u);
  }catch(e){}
}

function initRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){micBtn.style.opacity='0.4';return}
  const rec=new SR();rec.lang='uz-UZ';rec.continuous=false;rec.interimResults=false;
  rec.onstart=()=>{state.isListening=true;micBtn.classList.add('listening');recordingIndicator.classList.add('active')};
  rec.onresult=e=>{inputEl.value=e.results[0][0].transcript;setTimeout(sendMessage,300)};
  rec.onerror=e=>{state.isListening=false;micBtn.classList.remove('listening');recordingIndicator.classList.remove('active');
    if(e.error==='not-allowed')toast('Mikrofonga ruxsat bering','error');
    else if(e.error==='no-speech')toast('Ovoz eshitilmadi','error')
  };
  rec.onend=()=>{state.isListening=false;micBtn.classList.remove('listening');recordingIndicator.classList.remove('active')};
  state.recognition=rec;
}
function toggleListening(){
  if(!state.recognition){toast('Brauzerda ovoz yo\'q','error');return}
  if(state.isListening){try{state.recognition.stop()}catch(e){}}
  else{try{speechSynthesis.cancel();state.recognition.start()}catch(e){toast('Ovoz ishga tushmadi','error')}}
}

function renderMessage(role,content,animate=true){
  welcomeEl.classList.add('hidden');const div=document.createElement('div');
  div.className='message '+role;div.textContent=content;
  const m=document.createElement('div');m.className='meta';
  m.textContent=new Date().toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'});
  div.appendChild(m);
  if(role==='edit'){
    const b=document.createElement('button');b.className='speak-btn';b.textContent='🔊';b.onclick=()=>speak(content);div.appendChild(b)
  }
  chatEl.appendChild(div);if(animate)scrollBottom();
}
function showTyping(){
  const d=document.createElement('div');d.className='typing';d.id='typingIndicator';
  d.innerHTML='<span></span><span></span><span></span>';chatEl.appendChild(d);scrollBottom();
}
function hideTyping(){const t=$('typingIndicator');if(t)t.remove()}
function scrollBottom(){requestAnimationFrame(()=>{chatEl.scrollTop=chatEl.scrollHeight})}
function addMessage(role,content){
  state.messages.push({role:role,content:content,ts:Date.now()});
  if(state.messages.length>200)state.messages=state.messages.slice(-200);
  S.set('messages',state.messages);renderMessage(role,content);
}
  function searchKnowledge(text){
  const q=text.toLowerCase().replace(/[?.,!]/g,'').replace(/\s+/g,' ').trim();if(!q)return null;
  for(const key in WORLD_KNOWLEDGE){if(q.includes(key))return WORLD_KNOWLEDGE[key]}
  const words=q.split(' ').filter(w=>w.length>2);if(words.length===0)return null;
  let best=null,bestScore=0;
  for(const key in WORLD_KNOWLEDGE){
    let score=0;for(const w of words)if(key.includes(w))score++;
    if(score>bestScore){bestScore=score;best=WORLD_KNOWLEDGE[key]}
  }
  return bestScore>=1?best:null;
}

function findInFacts(question){
  if(!state.facts||state.facts.length===0)return null;
  const q=question.toLowerCase().replace(/[?.,!]/g,'');
  const skip=['kim','nima','qayer','qachon','mening','seni','sen','men','uchun','bilan','haqida','necha','nechta','qanday'];
  const words=q.split(/\s+/).filter(w=>w.length>2&&!skip.includes(w));if(words.length===0)return null;
  let best=null,bestScore=0;
  for(const f of state.facts){
    const ft=f.text.toLowerCase();let score=0;
    for(const w of words)if(ft.includes(w))score++;
    if(score>bestScore){bestScore=score;best=f.text}
  }
  return bestScore>0?'Eslab qolganimga ko\'ra: '+best:null;
}

async function sendMessage(){
  const text=inputEl.value.trim();if(!text||state.isProcessing)return;
  inputEl.value='';state.isProcessing=true;addMessage('user',text);
  if(handleSpecialCommand(text)){state.isProcessing=false;return}
  showTyping();
  try{
    const factReply=findInFacts(text);
    if(factReply){hideTyping();addMessage('edit',factReply);if(state.settings.voiceEnabled)speak(factReply);state.isProcessing=false;return}
    
    const knowledge=searchKnowledge(text);
    if(knowledge){hideTyping();addMessage('edit',knowledge);if(state.settings.voiceEnabled)speak(knowledge);state.isProcessing=false;return}
    
    const localReply=offlineResponse(text);
    if(localReply){hideTyping();addMessage('edit',localReply);if(state.settings.voiceEnabled)speak(localReply);state.isProcessing=false;return}
    
    let reply='';
    if(state.mode==='online'&&navigator.onLine&&isFactQuestion(text)){
      const found=await searchDuckDuckGo(text);reply=found||'Hech narsa topilmadi.'
    }else{
      reply='Oflayn rejimda bu savolga javob bera olmayman.'
    }
    hideTyping();if(reply){addMessage('edit',reply);if(state.settings.voiceEnabled)speak(reply)}
  }catch(e){
    hideTyping();addMessage('edit','Xatolik: '+(e.message||'noma\'lum'));toast('Xatolik','error')
  }finally{state.isProcessing=false}
}

function isFactQuestion(text){
  const t=text.toLowerCase();
  const factWords=['kim','nima','qayer','qachon','necha','nechta','qanday','nega','poytaxt','prezident','aholi','maydon','uzunlik','balandlik','who','what','where','when','how','why','capital','president','population','tarix','ilm','fan'];
  const chatWords=['salom','assalom','hayrli','xayr','rahmat','yaxshi','yomon','sen kimsan','isming','yaratuvchi','yordam','help','hello','hi','bye','thanks'];
  if(chatWords.some(w=>t.includes(w)))return false;
  return factWords.some(w=>t.includes(w))||text.includes('?');
}

async function searchDuckDuckGo(query){
  try{
    const url='https://api.duckduckgo.com/?q='+encodeURIComponent(query)+'&format=json&no_html=1&skip_disambig=1';
    const res=await fetch(url);if(!res.ok)return null;
    const data=await res.json();
    if(data.AbstractText&&data.AbstractText.length>10){
      let a='🔎 '+data.AbstractText;if(data.AbstractURL)a+='\n\nManba: '+data.AbstractURL;return a;
    }
    if(data.Answer)return '🔎 '+data.Answer;
    if(data.Definition)return '🔎 '+data.Definition;
    if(data.RelatedTopics&&data.RelatedTopics.length>0){
      const lines=[];
      for(const rt of data.RelatedTopics.slice(0,3)){
        if(rt.Text)lines.push('• '+rt.Text);
        else if(rt.Topics)for(const t of rt.Topics.slice(0,2))if(t.Text)lines.push('• '+t.Text)
      }
      if(lines.length)return '🔎 Topilganlar:\n'+lines.join('\n');
    }
    return null;
  }catch(e){return null}
                       }
  async function fetchNews(sourceKey,limit){
  const src=NEWS_SOURCES[sourceKey]||NEWS_SOURCES.uz;
  const proxy='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(src.url);
  try{
    const res=await fetch(proxy);if(!res.ok)throw new Error('RSS xato');
    const data=await res.json();if(data.status!=='ok'||!data.items)throw new Error('RSS bo\'sh');
    const items=data.items.slice(0,limit).map((it,i)=>{
      const title=(it.title||'').trim();const link=it.link||'';
      const date=it.pubDate?new Date(it.pubDate).toLocaleString('uz-UZ',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
      return(i+1)+'. '+title+'\n   🕐 '+date+'\n   🔗 '+link;
    });
    return '📰 '+src.name+':\n\n'+items.join('\n\n');
  }catch(e){return null}
}

async function showNews(sourceKey){
  if(!navigator.onLine){addMessage('edit','📴 Internet yo\'q');toast('Internet kerak','error');return}
  addMessage('user','📰 Yangiliklar');showTyping();
  const news=await fetchNews(sourceKey||'uz',5);hideTyping();
  if(news){addMessage('edit',news);speak('Mana so\'nggi yangiliklar')}
  else addMessage('edit','Yangiliklarni olib bo\'lmadi.');
}

function handleSpecialCommand(text){
  const low=text.toLowerCase().trim();
  if(/^(yangiliklar|yangilik|news)$/.test(low)||/^yangiliklar\s+/.test(low)){
    const src=low.includes('dunyo')?'dunyo':low.includes('kun')?'kun':low.includes('daryo')?'daryo':'uz';
    showNews(src);return true;
  }
  if(low.startsWith('eslab qol:')||low.startsWith('eslab qol ')){
    const fact=text.replace(/^eslab qol:?\s*/i,'').trim();
    if(fact){state.facts.push({text:fact,ts:Date.now()});S.set('facts',state.facts);addMessage('edit','Yodda tutdim: "'+fact+'" ✅');speak('Yodda tutdim')}return true;
  }
  if(low.startsWith('eslatib ber')||low.startsWith('eslab ber')){
    if(!state.facts.length)addMessage('edit','Hech narsa saqlanmagan. "Eslab qol: ..." deb yozing.');
    else addMessage('edit','Yodda tutganlarim:\n'+state.facts.map((f,i)=>(i+1)+'. '+f.text).join('\n'));return true;
  }
  if(low.startsWith('/qidir ')||low.startsWith('/search ')){
    const q=text.replace(/^\/(qidir|search)\s*/i,'').trim();doManualSearch(q);return true;
  }
  return false;
}

async function doManualSearch(query){
  if(!navigator.onLine){addMessage('edit','Internet yo\'q.');return}
  showTyping();const r=await searchDuckDuckGo(query);hideTyping();
  if(r){addMessage('edit',r);speak(r)}else addMessage('edit','"'+query+'" bo\'yicha topilmadi.');
}

function offlineResponse(text){
  const t=text.toLowerCase().trim();
  if(/^(salom|assalom|hayrli|hello|hi)\b/.test(t))return 'Salom, '+state.userName+'! Men EDIT.';
  if(/(sen kimsan|isming|o'zingni tanishtir|kim sen)/.test(t))return 'Men EDIT — '+CREATOR+' yaratgan sun\'iy ongman.';
  if(/(kim yarat|yaratuvchi|muallif)/.test(t))return 'Meni '+CREATOR+' yaratgan.';
  if(/(soat necha|vaqt qancha|time)/.test(t))return 'Hozir '+new Date().toLocaleTimeString('uz-UZ')+'.';
  if(/(bugun qaysi kun|sana|date)/.test(t))return 'Bugun '+new Date().toLocaleDateString('uz-UZ',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+'.';
  const mm=t.match(/(\d+[\.,]?\d*)\s*([\+\-\*\/x])\s*(\d+[\.,]?\d*)/);
  if(mm){
    const a=parseFloat(mm[1].replace(',','.')),op=mm[2],b=parseFloat(mm[3].replace(',','.'));let r;
    if(op==='+')r=a+b;else if(op==='-')r=a-b;else if(op==='*'||op==='x')r=a*b;else if(op==='/')r=b!==0?a/b:'xato';
    return a+' '+op+' '+b+' = '+r;
  }
  if(/(yordam|help|nima qila)/.test(t))return 'Ovozli suhbat, bilimlar, yangiliklar, kamera, xotira. Yangiliklar: "yangiliklar" deb yozing.';
  if(/(rahmat|tashakkur|thanks)/.test(t))return 'Arzimaydi! 😊';
  if(/(xayr|bye|ko'rishguncha)/.test(t))return 'Xayr! 👋';
  return null;
}

async function openCamera(){
  $('cameraModal').classList.add('active');$('ocrStatus').textContent='';
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:state.facingMode}});
    state.cameraStream=stream;$('cameraVideo').srcObject=stream;
  }catch(e){$('ocrStatus').textContent='Kameraga ruxsat berilmadi';toast('Kamera ochilmadi','error')}
}

function closeCamera(){
  if(state.cameraStream){state.cameraStream.getTracks().forEach(t=>t.stop());state.cameraStream=null}
  $('cameraVideo').srcObject=null;$('cameraModal').classList.remove('active');
}

async function switchCamera(){
  state.facingMode=state.facingMode==='environment'?'user':'environment';closeCamera();await openCamera();
}

async function captureAndOCR(){
  if(!state.cameraStream)return;const v=$('cameraVideo');
  if(!v.videoWidth){toast('Kamera tayyor emas','error');return}
  const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);const img=c.toDataURL('image/jpeg',0.9);
  $('ocrStatus').textContent='⏳ O\'qilmoqda...';toast('OCR boshlanmoqda...');
  try{
    if(typeof Tesseract==='undefined')throw new Error('Tesseract yuklanmagan');
    const r=await Tesseract.recognize(img,'uzb+rus+eng',{logger:m=>{if(m.status==='recognizing text')$('ocrStatus').textContent='⏳ '+Math.round(m.progress*100)+'%'}});
    const text=r.data.text.trim();closeCamera();
    if(text){
      addMessage('edit','📷 O\'qildi:\n'+text);
      if(state.mode==='online'&&navigator.onLine&&text.length<80){const s=await searchDuckDuckGo(text);if(s){addMessage('edit',s);speak(s)}}
    }else toast('Matn topilmadi','error');
  }catch(e){$('ocrStatus').textContent='Xato: '+e.message;toast('OCR xatosi','error')}
}

function loadSettingsUI(){
  $('nameInput').value=state.userName;$('rateSlider').value=state.settings.voiceRate;$('rateVal').textContent=state.settings.voiceRate;
  $('pitchSlider').value=state.settings.voicePitch;$('pitchVal').textContent=state.settings.voicePitch;
  $('volSlider').value=state.settings.voiceVolume;$('volVal').textContent=state.settings.voiceVolume;
  $('rateSlider').oninput=e=>$('rateVal').textContent=e.target.value;
  $('pitchSlider').oninput=e=>$('pitchVal').textContent=e.target.value;
  $('volSlider').oninput=e=>$('volVal').textContent=e.target.value;
}

function closeModal(id){$(id).classList.remove('active')}

function saveSettings(){
  state.userName=$('nameInput').value.trim()||'Ozodbek';
  state.settings.voiceRate=parseFloat($('rateSlider').value);
  state.settings.voicePitch=parseFloat($('pitchSlider').value);
  state.settings.voiceVolume=parseFloat($('volSlider').value);
  state.settings.voiceURI=$('voiceSelect').value;
  S.set('userName',state.userName);S.set('settings',state.settings);
  closeModal('settingsModal');toast('Saqlandi ✅','success');
}

function clearHistory(){
  if(!confirm('Suhbatni tozalaysizmi?'))return;
  state.messages=[];S.set('messages',[]);chatEl.innerHTML='';chatEl.appendChild(welcomeEl);welcomeEl.classList.remove('hidden');toast('Tozalandi ✅','success');
}

function clearAll(){
  if(!confirm('Hammasi o\'chiriladi. Davom etasizmi?'))return;
  ['messages','facts','settings','userName','mode'].forEach(k=>S.rm(k));location.reload();
}

function quickAction(t){inputEl.value=t;sendMessage()}

document.addEventListener('DOMContentLoaded',init);
</script>
